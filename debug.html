<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR debug</title>
<style>body{font-family:system-ui,sans-serif;background:#f8f2df;color:#202d47;padding:16px;font-size:15px}button,a.b{display:block;width:100%;margin:10px 0;padding:14px;font-size:16px;border:2px solid #202d47;background:#fff;color:#202d47;text-align:center;text-decoration:none;box-sizing:border-box}pre{white-space:pre-wrap;background:#fff;padding:10px;font-size:12px}</style></head><body>
<h3>AR 起動テスト</h3>
<pre id="info"></pre>
<a class="b" rel="ar" href="./avatar-ar.usdz?v=light-20261028#allowsContentScaling=1" id="ql"><img alt="" style="display:none">① iPhone：rel=ar リンク</a>
<a class="b" href="./avatar-ar.usdz?v=light-20261028">② iPhone：usdz 直リンク</a>
<a class="b" id="sv" href="#">③ Android：Scene Viewer</a>
<pre id="log"></pre>
<script>
var ua=navigator.userAgent,a=document.createElement('a');
var info={ua:ua,relAr:!!(a.relList&&a.relList.supports&&a.relList.supports('ar')),framed:(function(){try{return top!==self}catch(e){return true}})(),xr:'xr' in navigator};
document.getElementById('info').textContent=JSON.stringify(info,null,1);
var glb=new URL('./avatar-ar.glb?v=light-20261028',location.href).href;
document.getElementById('sv').href='intent://arvr.google.com/scene-viewer/1.2?file='+encodeURIComponent(glb)+'&mode=ar_preferred#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url='+encodeURIComponent(location.href+'#fallback')+';end;';
if(location.hash==='#fallback')document.getElementById('log').textContent='Scene Viewer が使えずfallbackした';
document.getElementById('ql').addEventListener('message',function(e){if(e.data==='_apple_ar_quicklook_button_tapped')document.getElementById('log').textContent='QL button';});
</script></body></html>
