<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2d48">
  <meta name="description" content="DCCのアバターを好きな場所に置いて楽しむAR体験。カードやQRの読み取りは不要です。">
  <title>DCC AR | アバターを好きな場所に</title>
  <link rel="icon" type="image/png" href="./dcc-icon-64.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preload" as="image" href="./avatar-ar-preview.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.4.0/dist/model-viewer.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="https://hark.site/s/ce784a6a-7054-47a3-b850-8b532f23cc08" aria-label="DCC学祭サイトへ戻る">
        <span class="brand-mark" aria-hidden="true"><img src="./dcc-icon-192.png" alt="" width="48" height="48"></span>
        <span class="brand-copy"><strong>DCC</strong><small>FESTIVAL 2026</small></span>
      </a>
      <a class="back-link" href="https://hark.site/s/ce784a6a-7054-47a3-b850-8b532f23cc08">
        <span aria-hidden="true">←</span> 学祭サイトへ
      </a>
    </header>

    <main>
      <section class="experience" aria-labelledby="page-title">
        <div class="intro">
          <div class="eyebrow"><span class="eyebrow-star" aria-hidden="true">✦</span> DCC AR EXPERIENCE <span class="eyebrow-num">01 / 01</span></div>
          <h1 id="page-title">アバターを、<br><span>好きな場所に。</span></h1>
          <p class="intro-lead">スマホのカメラで床を映して、置きたい場所をタップ。<br>カードもQRも使わず、目の前にアバターが現れます。</p>

          <div class="intro-note">
            <span class="note-icon" aria-hidden="true">⌖</span>
            <span>画面の3Dモデルは指で回せます。ARは対応スマホで楽しめます。</span>
          </div>

          <div class="cta-group">
            <button id="launch-ar" class="primary-button" type="button" disabled aria-describedby="ar-message">
              <span class="button-icon" aria-hidden="true">⌗</span>
              <span id="launch-label">ARを準備しています</span>
              <span class="button-arrow" aria-hidden="true">↗</span>
            </button>
            <p id="ar-message" class="ar-message" role="status" aria-live="polite">3Dモデルを読み込んでいます…</p>
          </div>
        </div>

        <div class="viewer-wrap">
          <div class="viewer-topline"><span>AVATAR / KQEDE</span><span class="live-dot" aria-hidden="true"></span><span>3D PREVIEW</span></div>
          <div class="viewer-stage">
            <div class="stage-grid" aria-hidden="true"></div>
            <div class="stage-halo" aria-hidden="true"></div>
            <div class="stage-floor" aria-hidden="true"></div>
            <model-viewer
              id="avatar-viewer"
              src="./avatar-ar.glb?v=light-20261028"
              ios-src="./avatar-ar.usdz?v=light-20261028"
              poster="./avatar-ar-preview.png"
              alt="黒いコートを着たDCCのアバター"
              loading="eager"
              reveal="auto"
              camera-controls
              autoplay
              animation-name="Idle_Breathe_Blink"
              touch-action="pan-y"
              camera-orbit="0deg 78deg 3.35m"
              camera-target="0m 0.87m 0m"
              min-camera-orbit="auto auto 1.4m"
              max-camera-orbit="auto auto 5m"
              field-of-view="30deg"
              exposure="1.15"
              shadow-intensity="0.6"
              shadow-softness="0.8"
              ar
              ar-modes="webxr scene-viewer quick-look"
              ar-placement="floor"
              ar-scale="auto">
              <span slot="progress-bar" class="viewer-progress" aria-hidden="true"><span id="progress-fill"></span></span>
              <span slot="ar-button" hidden></span>
            </model-viewer>
            <div class="viewer-sticker" aria-hidden="true"><span>★</span> YOUR SPACE,<br>YOUR STAGE.</div>
          </div>
          <div class="viewer-bottomline"><span>DRAG TO ROTATE</span><span aria-hidden="true">↔</span><span>PINCH TO ZOOM</span></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    /* 学祭サイト（Hark版の枠の中）からiOSのChromeなどで来たとき：?ar=1 ならARを直接開く。
       usdzはダウンロード扱いなのでページは残り、ARを閉じるとこのページが見える。 */
    (function () {
      if (!/[?&]ar=1/.test(location.search)) return;
      if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
      location.href = new URL('./avatar-ar.usdz?v=light-20261028', location.href).href;
    })();
  </script>
</body>
</html>
